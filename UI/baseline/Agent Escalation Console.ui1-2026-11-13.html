<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signatory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a trade floor. Buyer ladder | invoice, scenarios, timeline | seller ladder. Every value comes from config or evidence. */
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#eceff4; --ink:#17212f; --muted:#5a6676; --line:#d8dee7;
  --accent:#2f4fb5; --accent-ink:#ffffff;
  --buyer:#0d7466; --buyer-soft:#e0f2ee; --seller:#a95410; --seller-soft:#faecdc;
  --ok:#1d7439; --ok-soft:#e2f2e7; --warn:#8f5d00; --warn-soft:#fcf0d4; --bad:#b02424; --bad-soft:#fae5e5;
  --font-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --surface:#161d27; --surface-2:#1d2633; --ink:#e5eaf1; --muted:#9ba7b8; --line:#2a3544;
    --accent:#8ea4ff; --accent-ink:#0f141b;
    --buyer:#52c4b2; --buyer-soft:#12302c; --seller:#f0a65e; --seller-soft:#34230f;
    --ok:#62cf86; --ok-soft:#13301d; --warn:#f0c55c; --warn-soft:#342a10; --bad:#ff8080; --bad-soft:#3a1717;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#161d27; --surface-2:#1d2633; --ink:#e5eaf1; --muted:#9ba7b8; --line:#2a3544;
  --accent:#8ea4ff; --accent-ink:#0f141b;
  --buyer:#52c4b2; --buyer-soft:#12302c; --seller:#f0a65e; --seller-soft:#34230f;
  --ok:#62cf86; --ok-soft:#13301d; --warn:#f0c55c; --warn-soft:#342a10; --bad:#ff8080; --bad-soft:#3a1717;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h1{font-size:18px} h2{font-size:15px} h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:500}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.id{font-family:var(--font-mono);font-size:12px;white-space:nowrap}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand small{color:var(--muted)}
.strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chipst{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.chipst b{font-weight:600}
.chipst.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.chipst.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.chipst.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.chipst.off{color:var(--muted)}
.tabsrow{background:var(--surface);border-bottom:1px solid var(--line);padding:6px 20px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;max-width:1440px;margin:0 auto}
nav.tabs a{padding:7px 14px;border-radius:8px;text-decoration:none;color:var(--muted);border:1px solid transparent;font-weight:500;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
nav.tabs a .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;margin-left:6px;text-align:center}
main{padding:16px 20px 32px;max-width:1440px;margin:0 auto}
section.view{display:none}
section.view.active{display:block}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0 2px;color:var(--accent);cursor:pointer;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.reason{color:var(--warn);font-size:12px;margin-top:4px}
.reason div{margin:0}
.tag-b{color:var(--buyer);font-weight:600} .tag-s{color:var(--seller);font-weight:600}

/* banners */
.banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;border:1px solid var(--line);background:var(--surface)}
.banner.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}
.banner.bad b{color:var(--bad)}
.banner.warn{border-color:var(--warn);background:var(--warn-soft)}
.banner ul{margin:6px 0 0;padding-left:18px}
.full{max-width:720px;margin:48px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.full h2{margin-bottom:8px}
.full code{font-family:var(--font-mono);font-size:13px;background:var(--surface-2);padding:1px 6px;border-radius:6px}

/* floor */
.floor{display:grid;grid-template-columns:290px minmax(0,1fr) 290px;gap:16px;align-items:start}
.ladder{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ladder.buyer{border-top:3px solid var(--buyer)} .ladder.seller{border-top:3px solid var(--seller)}
.ladder > header{display:flex;flex-direction:column;gap:2px;margin-bottom:2px}
.ladder > header small{color:var(--muted)}
.node{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2);min-width:0}
.node.l1{margin-left:14px;border-style:dashed}
.node.l2{margin-left:28px;border-style:dashed}
.node.failed{border-color:var(--bad)}
.node .nm{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:6px;align-items:baseline;flex-wrap:wrap;overflow-wrap:anywhere}
.node .meta{font-size:12px;color:var(--muted)}
.node .badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.kind{font-size:11px;color:var(--muted);font-weight:500}

.center{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h2{margin-bottom:10px}
.card .sub{color:var(--muted);font-size:12px;margin:-6px 0 10px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.amounts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.amount{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.amount .n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;text-align:right}
.amount .l{color:var(--muted);font-size:12px}
.cardfoot{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}

.rail{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.step .num{font-family:var(--font-mono);font-weight:600;color:var(--muted)}
.step .ttl{font-weight:500}
.step .btn{grid-column:3;grid-row:1}
.step .reason{grid-column:2 / span 2}

.timeline{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);max-width:88%}
.ev.buyer{background:var(--buyer-soft);border-color:color-mix(in srgb,var(--buyer) 35%,var(--line));align-self:flex-start}
.ev.seller{background:var(--seller-soft);border-color:color-mix(in srgb,var(--seller) 35%,var(--line));align-self:flex-end}
.ev.cross{background:var(--surface-2);align-self:center;max-width:94%}
.ev.sys{background:transparent;border-style:dashed;align-self:center;max-width:94%;color:var(--muted)}
.ev time{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.ev .actor{font-weight:600;font-size:12px}
.ev .actor.b{color:var(--buyer)} .ev .actor.s{color:var(--seller)}
.ev .txt{font-size:13px;overflow-wrap:anywhere}

/* tables */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
.tbl{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.data td.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);font-weight:500;white-space:nowrap}
.pill.ai{color:var(--accent);border-color:var(--accent)}
.pill.human{color:var(--seller);border-color:var(--seller)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.note{color:var(--muted);font-size:12px;margin-top:8px}
.skel{color:var(--muted)}

@media (prefers-reduced-motion: no-preference){
  section.view.active{animation:fade .15s ease-out}
  @keyframes fade{from{opacity:.4}to{opacity:1}}
}
@media (max-width:1100px){
  .floor{grid-template-columns:minmax(0,1fr)}
  .ev{max-width:100%}
}
@media (max-width:760px){
  header.top,.tabsrow{padding-left:16px;padding-right:16px}
  nav.tabs{flex-wrap:nowrap;overflow-x:auto}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:4px}
  .amounts{grid-template-columns:minmax(0,1fr)}
  .ev{grid-template-columns:minmax(0,1fr)}
  .chipst{white-space:normal}
  .node.l1{margin-left:8px} .node.l2{margin-left:16px}
  .step{grid-template-columns:24px minmax(0,1fr)}
  .step .btn{grid-column:2;grid-row:auto;justify-self:start}
  .step .reason{grid-column:2}
  main{padding:12px 16px 24px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Signatory</h1>
    <small>Private AI decides. Signed credentials prove. NEAR enforces.</small>
  </div>
  <div class="strip" id="strip" aria-label="Status"></div>
</header>
<div class="tabsrow">
  <nav class="tabs" aria-label="Views">
    <a href="#live" data-tab="live">Live floor<span class="badge" id="badge-live" hidden></span></a>
    <a href="#buyer" data-tab="buyer"><span class="dot" style="background:var(--buyer)"></span><span id="tab-buyer">Buyer</span><span class="badge" id="badge-buyer" hidden></span></a>
    <a href="#seller" data-tab="seller"><span class="dot" style="background:var(--seller)"></span><span id="tab-seller">Seller</span><span class="badge" id="badge-seller" hidden></span></a>
    <a href="#proof" data-tab="proof">Proof trail</a>
  </nav>
</div>

<main id="main">
<div id="banners"></div>
<section class="view" id="view-live">
  <div class="floor">
    <aside class="ladder buyer" id="ladder-buyer" aria-label="Buyer authority ladder"></aside>
    <div class="center">
      <div class="card" id="invoice-card" aria-live="polite"></div>
      <div class="card"><h2>Scenarios</h2><div class="rail" id="rail"></div></div>
      <div class="card"><h2>Timeline</h2><p class="sub">Events taken from the evidence file. Entries with no recorded time show none.</p><div class="timeline" id="timeline"></div></div>
    </div>
    <aside class="ladder seller" id="ladder-seller" aria-label="Seller authority ladder"></aside>
  </div>
</section>
<section class="view" id="view-buyer"></section>
<section class="view" id="view-seller"></section>
<section class="view" id="view-proof"></section>
</main>

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (tag, attrs, ...kids) => {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k === "class") n.className = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  for (const c of kids){ if (c === null || c === undefined || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return n;
};
const isStr = v => typeof v === "string";
const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
const DASH = "—";

/* ---------- theme (data-theme hooks in the CSS) ---------- */
const THEMES = ["auto","light","dark"];
function applyTheme(t){
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
let theme = "auto";
try { const t = localStorage.getItem("signatory-theme"); if (THEMES.includes(t)) theme = t; } catch (e) {}
applyTheme(theme);

/* ---------- fmt ---------- */
const fmt = {
  short(id){ return isStr(id) && id.length > 16 ? id.slice(0,8) + "…" + id.slice(-5) : (isStr(id) ? id : DASH); },
  date(iso){
    if (!isStr(iso)) return null;
    const d = new Date(iso); if (isNaN(d)) return null;
    const m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()];
    return `${d.getUTCDate()} ${m} ${d.getUTCFullYear()} ${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")} UTC`;
  },
  day(iso){ const s = fmt.date(iso); return s ? s.replace(/ \d\d:\d\d UTC$/, "") : DASH; },
  bytes(s){ return isStr(s) ? new TextEncoder().encode(s).length : 0; },
  // Exact decimal × integer scale with BigInt (no floating point). Returns {text, exact} or null.
  scale(dec, scale){
    if (!isStr(dec) || !/^\d+(\.\d+)?$/.test(dec) || !Number.isSafeInteger(scale) || scale <= 0) return null;
    const [i, f = ""] = dec.split(".");
    const denom = 10n ** BigInt(f.length);
    const val = BigInt(i + f) * BigInt(scale);
    const whole = val / denom, rem = val % denom;
    const cents = (rem * 100n) / denom;
    return { text: whole.toLocaleString("en-US") + "." + String(cents).padStart(2, "0"), exact: (rem * 100n) % denom === 0n };
  },
};
// The amount exactly as serialized in the signed credential (acdcRaw), so no float re-formatting.
function rawNumber(raw, key){
  if (!isStr(raw)) return null;
  const m = raw.match(new RegExp('"' + key + '"\\s*:\\s*(-?\\d+(?:\\.\\d+)?(?:[eE][-+]?\\d+)?)'));
  return m ? m[1] : null;
}

/* ---------- copy ---------- */
function copyBtn(value, label){
  const b = el("button",{class:"linkbtn",type:"button","aria-label":`Copy ${label}`,text:"copy"});
  b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(value); b.textContent = "copied"; }
    catch (e) { b.textContent = "copy failed"; }
    setTimeout(() => { b.textContent = "copy"; }, 1500);
  });
  return b;
}
const idSpan = (id, label) => isStr(id) && id ? el("span",{class:"row",style:"gap:4px"}, el("span",{class:"id",title:id,text:fmt.short(id)}), copyBtn(id, label)) : el("span",{class:"skel",text:DASH});

/* ---------- config (§2.3) ---------- */
const DEFAULTS = {
  evidenceUrl:"./data/signatory-evidence.json", accountsUrl:"./data/accounts.json", rpcUrl:"", contractId:"",
  signerUrl:"", bridgeUrl:"", advisorsUrl:"", demoScale:1000000, realCurrency:"USD", pollMs:2000, probeMs:1500,
  explorer:"", explorerTxPath:"/txns/", explorerAccountPath:"/address/", sellerAgent:"", buyerAgent:""
};
function validateConfig(c){
  if (!isObj(c)) throw new Error("not a JSON object");
  const out = {...DEFAULTS};
  for (const k of Object.keys(DEFAULTS)){
    if (!(k in c)) continue;
    const want = typeof DEFAULTS[k];
    if (typeof c[k] !== want) throw new Error(`"${k}" must be a ${want}`);
    out[k] = c[k];
  }
  for (const k of ["demoScale","pollMs","probeMs"]) if (!Number.isSafeInteger(out[k]) || out[k] <= 0) throw new Error(`"${k}" must be a positive integer`);
  if (!out.sellerAgent || !out.buyerAgent) throw new Error('"sellerAgent" and "buyerAgent" are required');
  for (const k of ["rpcUrl","signerUrl","bridgeUrl","advisorsUrl","explorer"]) if (out[k] && !/^https?:\/\//.test(out[k])) throw new Error(`"${k}" must start with http:// or https://`);
  return out;
}

/* ---------- evidence (§3) ---------- */
function validateEvidence(e){
  const need = (cond, what) => { if (!cond) throw new Error(what); };
  need(isObj(e), "not a JSON object");
  need(isStr(e.generatedAt), "generatedAt missing");
  need(Array.isArray(e.companies) && e.companies.length > 0, "companies[] missing or empty");
  e.companies.forEach((c, i) => {
    need(isObj(c) && isStr(c.alias) && isStr(c.name) && isStr(c.lei), `companies[${i}] needs alias, name, lei`);
    need(Array.isArray(c.officers) && Array.isArray(c.agents), `companies[${i}] needs officers[] and agents[]`);
    c.officers.forEach((o, j) => need(isObj(o) && isStr(o.alias), `companies[${i}].officers[${j}].alias missing`));
    c.agents.forEach((a, j) => need(isObj(a) && isStr(a.alias) && isStr(a.delegatorAlias), `companies[${i}].agents[${j}] needs alias and delegatorAlias`));
  });
  need(isObj(e.checks) && typeof e.checks.passed === "boolean" && Array.isArray(e.checks.failures), "checks {passed, failures[]} missing");
  if (e.invoice !== null && e.invoice !== undefined){
    need(isObj(e.invoice) && isStr(e.invoice.said), "invoice.said missing");
    need(isObj(e.invoice.ipex), "invoice.ipex missing");
  }
  return e;
}

/* ---------- store ---------- */
const S = {
  cfg:null, ev:null, evErr:null,
  buyer:null, seller:null,           // company objects from evidence
  probes:{ signer:{st:"pending"}, bridge:{st:"pending"}, advisors:{st:"pending"} },
  near:{ st:"pending" },
};
const SERVICES = [["signer","Signer","signerUrl"],["bridge","Bridge","bridgeUrl"],["advisors","Advisors","advisorsUrl"]];

async function getJson(url){
  let res;
  try { res = await fetch(url, {cache:"no-store"}); }
  catch (e) { throw new Error(`fetch failed (${e.message})`); }
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  try { return await res.json(); } catch (e) { throw new Error("invalid JSON"); }
}

async function probe(key, urlKey){
  const url = S.cfg[urlKey];
  if (!url){ S.probes[key] = {st:"none"}; return; }
  const target = url.replace(/\/+$/,"") + "/health";
  try {
    const res = await fetch(target, {cache:"no-store", signal: AbortSignal.timeout(S.cfg.probeMs)});
    S.probes[key] = res.ok ? {st:"up", url} : {st:"down", url, why:`HTTP ${res.status}`};
  } catch (e) { S.probes[key] = {st:"down", url, why: e.name === "TimeoutError" ? `no answer in ${S.cfg.probeMs} ms` : e.message}; }
}

async function probeNear(){
  if (!S.cfg.contractId){ S.near = {st:"none"}; return; }
  if (!S.cfg.rpcUrl){ S.near = {st:"down", why:"rpcUrl not configured"}; return; }
  try {
    const res = await fetch(S.cfg.rpcUrl, {method:"POST", headers:{"Content-Type":"application/json"}, cache:"no-store",
      body: JSON.stringify({jsonrpc:"2.0", id:"signatory", method:"status", params:[]}), signal: AbortSignal.timeout(S.cfg.probeMs * 3)});
    const j = await res.json();
    if (!res.ok || !j.result) throw new Error(j.error ? (j.error.message || "RPC error") : `HTTP ${res.status}`);
    S.near = {st:"up", chain: isStr(j.result.chain_id) ? j.result.chain_id : null};
  } catch (e) { S.near = {st:"down", why: e.message}; }
}

/* ---------- derived ---------- */
const companyOfAgent = alias => S.ev ? S.ev.companies.find(c => c.agents.some(a => a.alias === alias)) || null : null;
const failuresFor = c => {
  if (!S.ev || !c) return [];
  const names = [c.alias, c.name, c.lei, ...c.officers.map(o => o.alias), ...c.agents.map(a => a.alias)].filter(Boolean);
  return S.ev.checks.failures.filter(f => isStr(f) && names.some(n => f.includes(n)));
};

      e.checks.strict ? "Export (strict): issuer = seller agent, officer holds OOR, delegation in KEL" : "Export run without --strict", res(e.checks.strict ? e.checks.passed : null, "passed", "failed"));
    add("IPEX grant", idSpan(i.ipex.grantSaid, "IPEX grant SAID"), "Fields: grant carries the invoice SAID", res(i.ipex.grantCredentialSaid ? i.ipex.grantCredentialSaid === i.said : null, "match", "different credential"));
    add("IPEX admit", el("span",{text:`by ${i.holderAlias || DASH}`}), "Export: admitSuccess; Fields: admit refers to this grant", res(i.ipex.admitSuccess === true && (!i.ipex.admitGrantSaid || i.ipex.admitGrantSaid === i.ipex.grantSaid) ? true : (i.ipex.admitSuccess === null || i.ipex.admitSuccess === undefined ? null : false), "admitted", "not admitted"));
  } else add("Invoice credential", DASH, "Listed", el("span",{class:"pill bad",text:"no invoice"}));
  if (isObj(src.run)) add("Run config", el("span",null, el("span",{class:"mono",text: src.run.config || DASH}), " · sha256 ", idSpan(src.run.sha256, "config sha256")), "Listed", res(null));
  add("NEAR transactions (register, pay, approve, revoke)", DASH, "NEAR RPC (UI-2)", el("span",{class:"pill warn",text: contractReason() ? "not available" : "UI-2"}));
  t.append(tb);
  card.append(el("div",{class:"tbl"}, t));
  const notes = Array.isArray(e.checks.notes) ? e.checks.notes : [];
  if (notes.length) card.append(el("div",{class:"note"}, el("b",{text:"Export notes: "}), ...notes.map(n => el("div",{text:String(n)}))));
  if (S.near.st !== "up") card.append(el("div",{class:"note",text:"NEAR rows: " + (contractReason() || "")}));
  sec.append(card);
}

/* ---------- tabs ---------- */
function renderTabs(){
  if (S.buyer) $("#tab-buyer").textContent = S.buyer.name;
  if (S.seller) $("#tab-seller").textContent = S.seller.name;
  const set = (id, n) => { const b = $(id); b.hidden = !n; b.textContent = n ? String(n) : ""; b.setAttribute("aria-label", `${n} failed check${n === 1 ? "" : "s"}`); };
  set("#badge-buyer", failuresFor(S.buyer).length);
  set("#badge-seller", failuresFor(S.seller).length);
  set("#badge-live", S.ev ? S.ev.checks.failures.length : 0);
}
function showTab(){
  const key = (location.hash || "#live").slice(1);
  const k = ["live","buyer","seller","proof"].includes(key) ? key : "live";
  document.querySelectorAll("section.view").forEach(s => s.classList.toggle("active", s.id === "view-" + k));
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.tab === k) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
}
window.addEventListener("hashchange", showTab);

function renderAll(){
  renderStrip(); renderBanners(); renderTabs();
  renderLadder("#ladder-buyer", S.buyer, "buyer", S.cfg.buyerAgent);
  renderLadder("#ladder-seller", S.seller, "seller", S.cfg.sellerAgent);
  renderInvoice(); renderRail(); renderTimeline();
  renderCompany("#view-buyer", S.buyer, "buyer", S.cfg.buyerAgent);
  renderCompany("#view-seller", S.seller, "seller", S.cfg.sellerAgent);
  renderProof();
}

function fullPage(title, ...body){
  document.querySelector(".tabsrow").hidden = true;
  $("#strip").replaceChildren();
  $("#main").replaceChildren(el("div",{class:"full",role:"alert"}, el("h2",{text:title}), ...body));
}

/* ---------- boot ---------- */
async function boot(){
  if (location.protocol === "file:"){   // C0
    fullPage("Open this page through the local server",
      el("p",null, "This page reads its config and the vLEI evidence over HTTP, which browsers block for files opened from disk."),
      el("p",null, "From the ", el("code",{text:"UI"}), " folder run ", el("code",{text:"node serve.mjs --port 8765"}), " and open ", el("code",{text:"http://127.0.0.1:8765/Agent%20Escalation%20Console.html"}), "."));
    return;
  }
  try { S.cfg = validateConfig(await getJson("./signatory-config.json")); }   // C1
  catch (e) { fullPage("signatory-config.json not loaded", el("p",{text:e.message})); return; }

  try { S.ev = validateEvidence(await getJson(S.cfg.evidenceUrl)); }   // E1
  catch (e) { S.ev = null; S.evErr = e.message; }
  if (S.ev){ S.buyer = companyOfAgent(S.cfg.buyerAgent); S.seller = companyOfAgent(S.cfg.sellerAgent); }
  renderAll(); showTab();

  await Promise.all([...SERVICES.map(([k,,u]) => probe(k, u)), probeNear()]);
  renderAll();
}
boot();
})();
</script>
