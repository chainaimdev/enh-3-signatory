<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signatory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* UI-5.2 chat-only: buyer panel | chat | seller panel. Every value comes from config, evidence, NEAR or the runner. */
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#eceff4; --ink:#17212f; --muted:#5a6676; --line:#d8dee7;
  --accent:#2f4fb5; --accent-ink:#ffffff;
  --buyer:#0d7466; --buyer-soft:#e0f2ee; --seller:#a95410; --seller-soft:#faecdc;
  --registrar:#2f4fb5; --contract:#6b3fa0; --ok:#1d7439; --ok-soft:#e2f2e7; --warn:#8f5d00; --warn-soft:#fcf0d4; --bad:#b02424; --bad-soft:#fae5e5;
  --font-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --surface:#161d27; --surface-2:#1d2633; --ink:#e5eaf1; --muted:#9ba7b8; --line:#2a3544;
    --accent:#8ea4ff; --accent-ink:#0f141b;
    --buyer:#52c4b2; --buyer-soft:#12302c; --seller:#f0a65e; --seller-soft:#34230f;
    --registrar:#8ea4ff; --contract:#c3a3f5; --ok:#62cf86; --ok-soft:#13301d; --warn:#f0c55c; --warn-soft:#342a10; --bad:#ff8080; --bad-soft:#3a1717;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#161d27; --surface-2:#1d2633; --ink:#e5eaf1; --muted:#9ba7b8; --line:#2a3544;
  --accent:#8ea4ff; --accent-ink:#0f141b;
  --buyer:#52c4b2; --buyer-soft:#12302c; --seller:#f0a65e; --seller-soft:#34230f;
  --registrar:#8ea4ff; --contract:#c3a3f5; --ok:#62cf86; --ok-soft:#13301d; --warn:#f0c55c; --warn-soft:#342a10; --bad:#ff8080; --bad-soft:#3a1717;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h1{font-size:17px} h2{font-size:15px} h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:500}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.id{font-family:var(--font-mono);font-size:12px;white-space:nowrap}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 20px;display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:baseline;min-width:0;flex-wrap:wrap}
.brand small{color:var(--muted)}
.strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chipst{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.chipst b{font-weight:600}
.chipst.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.chipst.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.chipst.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.chipst.off{color:var(--muted)}
main{padding:14px 20px 24px;max-width:1440px;margin:0 auto}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0 2px;color:var(--accent);cursor:pointer;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reason{color:var(--warn);font-size:12px;margin-top:4px}
.note,.meta{color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);font-weight:500;white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.stale{opacity:.55}
.result{font-size:12px;border-radius:8px;padding:6px 8px;border:1px solid var(--line);background:var(--surface);overflow-wrap:anywhere}
.result.bad{border-color:var(--bad)}
details.raw summary{cursor:pointer;color:var(--muted);font-size:12px}
details.raw pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--font-mono);font-size:11px;margin:4px 0 0;max-height:320px;overflow-y:auto}
a.tx{font-family:var(--font-mono);font-size:12px;color:var(--accent)}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;border:1px solid var(--line);background:var(--surface)}
.banner.bad{border-color:var(--bad);background:var(--bad-soft)}
.banner.warn{border-color:var(--warn);background:var(--warn-soft)}
.full{max-width:720px;margin:48px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.full code{font-family:var(--font-mono);font-size:13px;background:var(--surface-2);padding:1px 6px;border-radius:6px}

/* layout: buyer | chat | seller */
.floor{display:grid;grid-template-columns:270px minmax(0,1fr) 270px;grid-template-areas:"buyer chat seller";gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.panel.buyer{grid-area:buyer;border-top:3px solid var(--buyer)} .panel.seller{grid-area:seller;border-top:3px solid var(--seller)}
.panel .who{display:flex;gap:8px;align-items:center;min-width:0}
.panel .who h2{overflow-wrap:anywhere}
.panel .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:16px;flex:none}
.panel.buyer .av{border:2px solid var(--buyer)} .panel.seller .av{border:2px solid var(--seller)}
.kv{display:grid;grid-template-columns:76px minmax(0,1fr);gap:3px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.badge{border-radius:10px;padding:6px 8px;border:1px solid var(--line);background:var(--surface-2);font-size:12px}
.badge.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.badge.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.badge.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.badge b{font-weight:600}

.chat{grid-area:chat;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.chatlog{display:flex;flex-direction:column;gap:8px;min-height:240px;max-height:calc(100vh - 230px);overflow-y:auto;padding:2px}
.runlog{display:flex;flex-direction:column;gap:8px}
.bub{--c:var(--muted);display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:start;max-width:94%}
.bub.seller{--c:var(--seller)} .bub.buyer{--c:var(--buyer)} .bub.registrar{--c:var(--registrar)} .bub.contract{--c:var(--contract)} .bub.human,.bub.runner{--c:var(--muted)}
.bub .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--c);font-size:15px;line-height:1}
.bub .bb{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:4px 12px 12px 12px;padding:6px 10px;background:var(--surface-2);min-width:0;font-size:13px}
.bub.failed .bb{border-color:var(--bad);background:var(--bad-soft)}
.bub .hd{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;font-size:12px}
.bub .nm{font-weight:600;color:var(--c)}
.bub .txt{overflow-wrap:anywhere;margin-top:2px}
.bub time{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.bub.you{margin-left:auto;grid-template-columns:minmax(0,1fr)}
.bub.you .bb{border-left-width:1px;border-right:4px solid var(--accent);border-radius:12px 4px 12px 12px;background:var(--surface)}
.typing{font-size:12px;color:var(--muted);margin-top:4px}
.sysline{align-self:center;font-size:12px;color:var(--muted);text-align:center;max-width:94%;overflow-wrap:anywhere}
.summary{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);font-size:13px}
.summary h3{margin:8px 0 4px}
.tbl{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th{text-align:left;color:var(--muted);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.prevrun{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface)}
.prevrun > summary{cursor:pointer;font-size:13px}
.composer{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.composer input{flex:1 1 220px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;vertical-align:middle}

@media (prefers-reduced-motion: no-preference){
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
}
@media (max-width:1100px){
  .floor{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"buyer seller" "chat chat"}
  .chatlog{max-height:none}
}
@media (max-width:760px){
  header.top{padding:8px 16px}
  main{padding:12px 16px 20px}
  .floor{grid-template-columns:minmax(0,1fr);grid-template-areas:"buyer" "seller" "chat"}
  .chipst{white-space:normal}
  .bub{max-width:100%}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Signatory</h1><small>Private AI decides. Signed credentials prove. NEAR enforces.</small></div>
  <div class="strip" id="strip" aria-label="Status"></div>
</header>
<main id="main">
  <div id="banners"></div>
  <div class="floor">
    <aside class="panel buyer" id="panel-buyer" aria-label="Buyer agent"></aside>
    <section class="chat" aria-label="Chat">
      <div class="chatlog" id="chat-live" aria-live="polite"></div>
      <div class="composer">
        <div class="row"><input id="req" type="text" autocomplete="off" maxlength="500" placeholder="Request as the buyer, e.g. Need 8,000 t-shirts, about $84,000" aria-label="Request to the buyer agent"><button id="run-text" class="btn primary" type="button" disabled>Send</button></div>
        <div id="run-reason"></div>
      </div>
    </section>
    <aside class="panel seller" id="panel-seller" aria-label="Seller agent"></aside>
  </div>
</main>

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (tag, attrs, ...kids) => {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k === "class") n.className = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  for (const c of kids){ if (c === null || c === undefined || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return n;
};
const isStr = v => typeof v === "string";
const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
const DASH = "—";

/* ---------- theme ---------- */
const THEMES = ["auto","light","dark"];
function applyTheme(t){
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
let theme = "auto";
try { const t = localStorage.getItem("signatory-theme"); if (THEMES.includes(t)) theme = t; } catch (e) {}
applyTheme(theme);

/* ---------- fmt (BigInt for amounts, no floats) ---------- */
const fmt = {
  short(id){ return isStr(id) && id.length > 16 ? id.slice(0,8) + "…" + id.slice(-5) : (isStr(id) ? id : DASH); },
  units(u, d){
    if (!/^\d+$/.test(String(u)) || !Number.isInteger(d) || d < 0) return null;
    const s = String(u).padStart(d + 1, "0");
    const w = s.slice(0, s.length - d), f = d ? s.slice(s.length - d).replace(/0+$/, "") : "";
    return f ? `${w}.${f}` : w;
  },
  scale(dec, scale){
    if (!isStr(dec) || !/^\d+(\.\d+)?$/.test(dec) || !Number.isSafeInteger(scale) || scale <= 0) return null;
    const [i, f = ""] = dec.split(".");
    const denom = 10n ** BigInt(f.length), val = BigInt(i + f) * BigInt(scale);
    const whole = val / denom, cents = ((val % denom) * 100n) / denom;
    return whole.toLocaleString("en-US") + "." + String(cents).padStart(2, "0");
  },
  // ISO or ns timestamp → "13 Nov 2026 10:12:51 UTC"
  when(t){
    if (t === null || t === undefined) return null;
    let ms;
    if (/^\d{16,}$/.test(String(t))) ms = Number(BigInt(String(t)) / 1000000n); else ms = Date.parse(String(t));
    if (isNaN(ms)) return String(t);
    const d = new Date(ms), p = n => String(n).padStart(2, "0");
    return `${d.getUTCDate()} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()]} ${d.getUTCFullYear()} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())} UTC`;
  },
  clock(ms){ const d = new Date(ms); return isNaN(d) ? DASH : d.toLocaleTimeString("en-GB"); },
  ms(n){ return Number.isFinite(n) ? (n >= 1000 ? `${(n / 1000).toFixed(1)} s` : `${n} ms`) : null; },
};
function copyBtn(value, label){
  const b = el("button",{class:"linkbtn",type:"button","aria-label":`Copy ${label}`,text:"copy"});
  b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(value); b.textContent = "copied"; } catch (e) { b.textContent = "copy failed"; }
    setTimeout(() => { b.textContent = "copy"; }, 1500);
  });
  return b;
}
const idSpan = (id, label) => isStr(id) && id ? el("span",{class:"row",style:"gap:4px;display:inline-flex"}, el("span",{class:"id",title:id,text:fmt.short(id)}), copyBtn(id, label)) : el("span",{class:"meta",text:DASH});
// Never show BRAN / key-like lines (the runner strips them too; this is a second guard).
const KEYLIKE = /\b(bran|passcode|salt|seed|private[_ -]?key|secret[_ -]?key|secret)\b|ed25519:[1-9A-HJ-NP-Za-km-z]{40,}/i;
const scrub = text => String(text).split("\n").map(l => KEYLIKE.test(l) ? "[line hidden: key-like content]" : l).join("\n");

/* ---------- config (unknown keys ignored) ---------- */
const DEFAULTS = {
  evidenceUrl:"./data/signatory-evidence.json", accountsUrl:"./data/accounts.json", rpcUrl:"", contractId:"",
  signerUrl:"", bridgeUrl:"", advisorsUrl:"", runnerUrl:"", demoScale:1000000, realCurrency:"USD", pollMs:2000, probeMs:1500,
  explorer:"", explorerTxPath:"/txns/", explorerAccountPath:"/address/", sellerAgent:"", buyerAgent:"", txIndexUrl:""
};
function validateConfig(c){
  if (!isObj(c)) throw new Error("not a JSON object");
  const out = {...DEFAULTS};
  for (const k of Object.keys(DEFAULTS)){
    if (!(k in c)) continue;
    if (typeof c[k] !== typeof DEFAULTS[k]) throw new Error(`"${k}" must be a ${typeof DEFAULTS[k]}`);
    out[k] = c[k];
  }
  for (const k of ["demoScale","pollMs","probeMs"]) if (!Number.isSafeInteger(out[k]) || out[k] <= 0) throw new Error(`"${k}" must be a positive integer`);
  if (!out.sellerAgent || !out.buyerAgent) throw new Error('"sellerAgent" and "buyerAgent" are required');
  for (const k of ["rpcUrl","signerUrl","bridgeUrl","advisorsUrl","runnerUrl","explorer","txIndexUrl"]) if (out[k] && !/^https?:\/\//.test(out[k])) throw new Error(`"${k}" must start with http:// or https://`);
  return out;
}
function validateEvidence(e){
  if (!isObj(e) || !isStr(e.generatedAt)) throw new Error("generatedAt missing");
  if (!Array.isArray(e.companies) || !e.companies.length) throw new Error("companies[] missing or empty");
  e.companies.forEach((c, i) => { if (!isObj(c) || !Array.isArray(c.officers) || !Array.isArray(c.agents)) throw new Error(`companies[${i}] needs officers[] and agents[]`); });
  if (!isObj(e.checks) || typeof e.checks.passed !== "boolean" || !Array.isArray(e.checks.failures)) throw new Error("checks {passed, failures[]} missing");
  return e;
}

/* ---------- store ---------- */
const S = {
  cfg:null, ev:null, evErr:null, acc:null, accErr:null,
  probes:{ signer:{st:"pending"}, bridge:{st:"pending"}, runner:{st:"pending"} },
  near:{ st:"pending" },
  chain:{ st:"pending", at:0, why:null, token:null, mandate:undefined, invoices:{} },   // values read from NEAR (truth stays on chain)
  runner:{ st:"none", phase:null, next:null, runnable:[], active:null, why:null },    // capabilities read from the runner
  live:{ run:null, posting:false, err:null },
  chat:[],                    // [{kind:"run", run} | {kind:"click", row}] this page session
  busy:null,
};
const SERVICES = [["signer","Signer","signerUrl"],["bridge","Bridge","bridgeUrl"],["runner","Runner","runnerUrl"]];
const jsonOrError = async res => { try { return await res.json(); } catch (e) { return {ok:false, error:`HTTP ${res.status}, answer is not JSON`}; } };

async function getJson(url){
  let res;
  try { res = await fetch(url, {cache:"no-store"}); } catch (e) { throw new Error(`fetch failed (${e.message})`); }
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  try { return await res.json(); } catch (e) { throw new Error("invalid JSON"); }
}
async function loadEvidence(){
  try { S.ev = validateEvidence(await getJson(S.cfg.evidenceUrl)); S.evErr = null; }
  catch (e) { S.evErr = e.message; }   // keep the last good copy if a re-read fails
}
async function probe(key, urlKey){
  const url = S.cfg[urlKey];
  if (!url){ S.probes[key] = {st:"none"}; return; }
  try {
    const res = await fetch(url.replace(/\/+$/,"") + "/health", {cache:"no-store", signal: AbortSignal.timeout(S.cfg.probeMs)});
    S.probes[key] = res.ok ? {st:"up", url} : {st:"down", url, why:`HTTP ${res.status}`};
  } catch (e) { S.probes[key] = {st:"down", url, why: e.name === "TimeoutError" ? `no answer in ${S.cfg.probeMs} ms` : e.message}; }
}
function serviceReason(key, label){
  const p = S.probes[key];
  if (p.st === "none") return `${label} not configured`;
  if (p.st === "down") return `${label} not reachable at ${p.url} (${p.why})`;
  if (p.st === "pending") return `${label}: checking…`;
  return null;
}

/* ---------- NEAR reads (view calls only) ---------- */
async function rpcCall(method, params){
  const res = await fetch(S.cfg.rpcUrl, {method:"POST", headers:{"Content-Type":"application/json"}, cache:"no-store",
    body: JSON.stringify({jsonrpc:"2.0", id:"signatory", method, params}), signal: AbortSignal.timeout(S.cfg.probeMs * 4)});
  const j = await jsonOrError(res);
  if (j.error) throw new Error(isStr(j.error) ? j.error : isStr(j.error.data) ? j.error.data : (j.error.cause && j.error.cause.name) || j.error.message || "RPC error");
  if (!res.ok) throw new Error(`RPC HTTP ${res.status}`);
  return j.result;
}
const b64 = s => { let o = ""; for (const b of new TextEncoder().encode(s)) o += String.fromCharCode(b); return btoa(o); };
async function viewCall(account, method, args){
  const r = await rpcCall("query", {request_type:"call_function", finality:"final", account_id:account, method_name:method, args_base64:b64(JSON.stringify(args || {}))});
  if (r.error) throw new Error(r.error);
  const text = new TextDecoder().decode(new Uint8Array(r.result));
  return text === "" ? null : JSON.parse(text);
}
const alias = role => S.acc && isObj(S.acc.aliases) ? Object.keys(S.acc.aliases).find(k => isObj(S.acc.aliases[k]) && S.acc.aliases[k].role === role) || null : null;
const accountOf = a => a && S.acc && isObj(S.acc.aliases) && isObj(S.acc.aliases[a]) ? S.acc.aliases[a].account : null;
const agentAccount = () => accountOf(S.cfg.buyerAgent);
function aliasOf(acct){
  if (!isStr(acct)) return DASH;
  if (S.acc && isObj(S.acc.aliases)) for (const [k, v] of Object.entries(S.acc.aliases)) if (isObj(v) && v.account === acct) return k;
  if (S.acc && acct === S.acc.owner) return "contract owner";
  return acct;
}
function runSaid(run){
  if (run.finished && isStr(run.finished.said)) return run.finished.said;
  if (run.started && isStr(run.started.said)) return run.started.said;

// Phase B is detected from the runner itself: GET /next-invoice exists only there.
async function fetchRunnerInfo(){
  if (!S.cfg.runnerUrl){ S.runner = {st:"none", phase:null, next:null, runnable:[], active:null, why:null}; return; }
  if (S.probes.runner.st !== "up"){ S.runner = {st:"down", phase:null, next:null, runnable:[], active:null, why:null}; return; }
  try {
    const t = AbortSignal.timeout(S.cfg.probeMs * 6);
    const [rn, rh] = await Promise.all([fetch(runnerBase() + "/next-invoice", {cache:"no-store", signal:t}), fetch(runnerBase() + "/health", {cache:"no-store", signal:t})]);
    const h = await jsonOrError(rh), active = isObj(h.activeRun) ? h.activeRun : null;
    if (rn.ok){ S.runner = {st:"up", phase:"B", next: await jsonOrError(rn), runnable:[], active, why:null}; return; }
    const ri = await fetch(runnerBase() + "/invoices", {cache:"no-store", signal:t});
    const j = await jsonOrError(ri);

    S.runner = {st:"up", phase:"A", next:null, runnable: j.invoices.filter(x => isObj(x) && x.runnable === true), active, why:null};
  } catch (e) { S.runner = {st:"err", phase:null, next:null, runnable:[], active:null, why: e.name === "TimeoutError" ? "no answer" : e.message}; }
}
async function readSse(url, signal, headers, onEvent){
  const res = await fetch(url, {headers, cache:"no-store", signal});
  if (!res.ok || !res.body){ const j = await jsonOrError(res); throw new Error(j.error || `HTTP ${res.status}`); }
  const rd = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = "";
  for (;;){
    const {value, done} = await rd.read();
    if (done) break;
    buf += value.replace(/\r\n?/g, "\n");
    let k;
    while ((k = buf.indexOf("\n\n")) >= 0){
      const block = buf.slice(0, k); buf = buf.slice(k + 2);
      let name = "message"; const data = [];
      for (const line of block.split("\n")){
        if (!line || line.startsWith(":")) continue;
        const c = line.indexOf(":"), field = c < 0 ? line : line.slice(0, c);
        let v = c < 0 ? "" : line.slice(c + 1); if (v.startsWith(" ")) v = v.slice(1);
        if (field === "event") name = v; else if (field === "data") data.push(v);
      }
      if (data.length) onEvent(name, data.join("\n"));
    }
  }
}
async function startRun(text){

  catch (e) { S.live.posting = false; S.live.err = {error:`runner not reachable at ${runnerBase()} (${e.message})`}; renderChat(); return; }
  const j = await jsonOrError(res);
  S.live.posting = false;
  if (!res.ok || j.ok !== true || !isStr(j.runId)){   // 409 / 404 / 400 shown inline
    S.live.err = {http: res.status, error: j.error || `HTTP ${res.status}`, activeRunId: isStr(j.activeRunId) ? j.activeRunId : null};
    renderChat(); return;
  }

}
function attachRun(runId, req){

  const run = {runId, req, started:null, steps:[], finished:null, lastSeq:0, decide:{busy:null, err:null}, streamErr:null, ctl:null};
  S.live.run = run; S.live.err = null; S.chat.push({kind:"run", run});

async function streamRun(run){
  const url = `${runnerBase()}/runs/${encodeURIComponent(run.runId)}/events`;
  for (let attempt = 0; !run.finished && attempt < 6; attempt++){
    const ctl = new AbortController(); run.ctl = ctl;
    const headers = {Accept:"text/event-stream"};
    if (run.lastSeq) headers["Last-Event-ID"] = String(run.lastSeq);
    try { await readSse(url, ctl.signal, headers, (name, text) => onRunEvent(run, name, text)); run.streamErr = null; }
    catch (e) { if (e.name === "AbortError") break; run.streamErr = e.message; }
    if (run.finished) break;
    renderChat();
    await new Promise(r => setTimeout(r, 3000));   // the runner's own "retry: 3000"
  }
  if (!run.finished && !run.streamErr) run.streamErr = "event stream closed before the run finished";

let refreshSoon = null;

function onRunEvent(run, name, text){

  else if (name === "run" && d.state === "finished"){ run.finished = d; if (run.ctl) run.ctl.abort(); }

  const took = isObj(d.api) && Number.isFinite(d.api.ms) ? fmt.ms(d.api.ms) : null;
  const body = el("div",{class:"bb"},
    el("div",{class:"hd"}, el("span",{class:"nm",title:a.account || null,text:a.name}), t ? el("span",{class:"meta",title:t.account || null,text:"→ " + t.name}) : null,
      d.step ? el("span",{class:"pill",text:(Number.isInteger(d.index) ? d.index + " · " : "") + d.step}) : null, st ? el("span",{class:STCLS(st),text:st}) : null,
      d.ts ? el("time",{text: fmt.when(d.ts) || ""}) : null, took ? el("span",{class:"meta",text:`took ${took}`}) : null));
  if (d.history) body.append(el("div",{class:"meta",style:"font-style:italic",text:"vLEI proof — pre-issued credential, not a live action in this run"}));
  if (d.text) body.append(el("div",{class:"txt",text:scrub(d.text)}));
  const h = hashOf(d);
  if (h) body.append(el("div",{class:"meta"}, "tx ", txLink(h)));
  if (st === "running") body.append(el("div",{class:"typing",role:"status"}, el("span",{class:"spin","aria-hidden":"true"}), ` Typing… (${a.name}${t ? " → " + t.name : ""})`));
  const det = apiBlock(d); if (det) body.append(det);
  if (d.src) body.append(el("div",{class:"meta",text:d.src}));
  if (extra) body.append(extra);
  return el("div",{class:"bub " + a.cls + (st === "failed" ? " failed" : "")}, el("div",{class:"av","aria-hidden":"true",text:a.av}), body);
}
function escalationBubble(run){
  if (!isWaiting(run)) return null;
  const said = runSaid(run);
  const out = run.steps.find(s => s.step === "outcome");
  const reasons = [serviceReason("runner","Runner")].filter(Boolean);
  const mk = what => el("button",{class: what === "approve" ? "btn primary" : "btn", type:"button", disabled: reasons.length || run.decide.busy ? "disabled" : null,
    text: run.decide.busy === what ? "Sending…" : what === "approve" ? "Approve" : "Reject", onclick: () => decideRun(run, what)});
  const inv = run.started && isObj(run.started.invoice) ? run.started.invoice : null;
  const extra = el("div",null, el("div",{class:"row",style:"margin-top:6px"}, mk("approve"), mk("reject")),
    run.decide.busy ? el("div",{class:"typing"}, el("span",{class:"spin","aria-hidden":"true"}), ` Typing… (sending your ${run.decide.busy} through the runner)`) : null,
    reasons.length ? el("div",{class:"reason"}, ...reasons.map(r => el("div",{text:"Blocked: " + r}))) : null,
    run.decide.err ? el("div",{class:"result bad"}, el("span",{class:"mono",text:scrub(run.decide.err)})) : null);
  return bubble({actor: out.target, target:{id:"contract"}, step:"escalation", status:"waiting",
    text:`Escalated to you: ${inv ? `${inv.invoiceNumber} (${inv.amount} ${inv.currency})` : said ? fmt.short(said) : "this run's invoice"} is above the agent's limit and held by the contract. Approve or reject.`}, extra);
}
function startedLine(s){
  const parts = [];
  if (isObj(s.invoice)) parts.push(`invoice ${s.invoice.invoiceNumber} · ${s.invoice.amount} ${s.invoice.currency}${s.invoice.realAmount ? " (" + s.invoice.realAmount + ")" : ""}${s.invoice.status ? " · NEAR " + s.invoice.status : ""}`);
  if (isObj(s.mandate)) parts.push(`agent limit ${s.mandate.limit}${s.mandate.revoked ? " · agent TURNED OFF" : ""}`);
  if (isObj(s.request) && isObj(s.request.parsed)){ const p = s.request.parsed; parts.push(p.amountSource ? `read "${p.amountSource}" as ${p.amount} USDC` : "no amount read"); }
  if (s.mode) parts.push(`mode ${s.mode}`);
  return el("div",{class:"sysline",text:`run ${s.runId} started` + (parts.length ? " · " + parts.join(" · ") : "")});
}
const evInvoice = said => S.ev && Array.isArray(S.ev.invoices) ? S.ev.invoices.find(i => i.said === said) || null : null;
function proofOf(run){
  const said = runSaid(run);
  const stepData = name => { const s = run.steps.find(x => x.step === name); return s && isObj(s.data) ? s.data : {}; };
  const ev = said ? evInvoice(said) : null;
  const ip = ev && isObj(ev.ipex) ? ev.ipex : {};
  return { said, grant: stepData("offer").grantSaid || ip.grantSaid || null,
    admit: stepData("accept").admitSuccess ?? ip.admitSuccess, held: stepData("accept").credentialHeld ?? ip.credentialHeld,
    anchor: ev && ev.issuance && ev.issuance.anchor ? ev.issuance.anchor : null, tel: ev && ev.issuance && ev.issuance.telEvent ? ev.issuance.telEvent.said : null,
    issuanceVerified: ev ? ev.issuanceVerified : undefined };
}
function summaryText(run){
  const f = run.finished, s = run.started || {}, pr = proofOf(run), L = [`Run ${run.runId}: ${f.result} — ${f.text || ""}`];
  if (isObj(s.invoice)) L.push(`Invoice ${s.invoice.invoiceNumber} ${s.invoice.amount} ${s.invoice.currency}`);
  for (const st of run.steps) L.push(`${st.index ?? ""} ${st.step} ${st.status} ${st.ts}${isObj(st.api) && Number.isFinite(st.api.ms) ? " (" + fmt.ms(st.api.ms) + ")" : ""}${hashOf(st) ? " tx " + hashOf(st) : ""}`);
  if (pr.said) L.push(`Invoice SAID ${pr.said}; IPEX grant ${pr.grant || "-"}; admit ${pr.admit}; held ${pr.held}`);
  if (pr.anchor) L.push(`Issuance anchor: issuer KEL ${pr.anchor.t} s=${pr.anchor.kelSeq} ${pr.anchor.ixnSaid}; TEL iss ${pr.tel}`);
  return scrub(L.join("\n"));
}
function summaryCard(run){
  const f = run.finished, pr = proofOf(run);
  const card = el("div",{class:"summary"}, el("div",{class:"row"}, el("b",{text:"Run summary"}), el("span",{class:STCLS(f.result || ""),text:f.result || DASH}), el("span",{class:"meta",text:`${run.runId} · ${fmt.when(f.ts) || ""}`})));
  if (f.text) card.append(el("div",{text:scrub(f.text)}));
  if (run.steps.length){
    const tb = el("tbody");
    for (const st of run.steps) tb.append(el("tr",null, el("td",{text:`${Number.isInteger(st.index) ? st.index + ". " : ""}${st.step}`}), el("td",null, el("span",{class:STCLS(st.status || ""),text:st.status || DASH})),
      el("td",{class:"mono",text: fmt.when(st.ts) || DASH}), el("td",{class:"mono",text: isObj(st.api) && Number.isFinite(st.api.ms) ? fmt.ms(st.api.ms) : DASH}),
      el("td",null, hashOf(st) ? txLink(hashOf(st)) : el("span",{class:"meta",text:DASH}))));
    card.append(el("div",{class:"tbl"}, el("table",{class:"data"}, el("thead",null, el("tr",null, ...["Step","Status","Time","Took","Tx"].map(h => el("th",{text:h})))), tb)));
  }
  if (pr.said){
    card.append(el("h3",{text:"vLEI proof"}));
    card.append(kv([["Invoice", idSpan(pr.said, "invoice SAID")], ["Grant", idSpan(pr.grant, "IPEX grant SAID")],
      ["Admit/held", `${pr.admit === true ? "✓" : pr.admit === false ? "✗" : "?"} / ${pr.held === true ? "✓" : pr.held === false ? "✗" : "?"}`],
      ["Anchor", pr.anchor ? el("span",null, `issuer KEL ${pr.anchor.t} s=${pr.anchor.kelSeq} `, idSpan(pr.anchor.ixnSaid, "anchor SAID"), " · TEL iss ", idSpan(pr.tel, "TEL iss SAID"),
        pr.issuanceVerified === true ? " · verified by the exporter" : "") : "not in the loaded evidence"]]));
    const v = S.chain.invoices[pr.said];
    card.append(el("h3",{text:"On NEAR now"}));
    card.append(el("div",{class:stale().trim(),text: v ? `get_invoice: ${v.status} · ${tokenText(v.amount_units)}${realText(v.amount_units) ? " (" + realText(v.amount_units) + ")" : ""}${v.payer ? " · payer " + aliasOf(v.payer) : ""}` : v === null ? "get_invoice: not registered" : "get_invoice: not read yet"}));
  }
  card.append(el("div",{class:"row",style:"margin-top:6px"}, el("span",{class:"meta",text:"summary:"}), copyBtn(summaryText(run), "run summary")));
  return card;
}
function runLog(run){
  const box = el("div",{class:"runlog"});
  box.append(el("div",{class:"bub you"}, el("div",{class:"bb"}, el("div",{class:"hd"}, el("span",{class:"nm",text:"You (buyer)"}), run.started ? el("time",{text:fmt.when(run.started.ts) || ""}) : null),
    el("div",{class:"txt",text: isStr(run.req.text) ? run.req.text : `run ${run.runId}`}))));
  if (run.started) box.append(startedLine(run.started));
  else if (!run.finished) box.append(el("div",{class:"sysline"}, el("span",{class:"spin","aria-hidden":"true"}), ` connecting to run ${run.runId}…`));
  for (const st of run.steps) box.append(bubble(st));
  const esc = escalationBubble(run); if (esc) box.append(esc);
  if (run.streamErr && !run.finished) box.append(el("div",{class:"result bad",role:"alert"}, "event stream: ", el("span",{class:"mono",text:run.streamErr})));
  if (run.finished) box.append(summaryCard(run));
  return box;
}
function renderControls(){
  const reasons = [];
  const rr = serviceReason("runner","Runner"); if (rr) reasons.push(rr);
  else if (S.runner.st === "err") reasons.push(`runner not usable: ${S.runner.why}`);
  else if (S.runner.st !== "up") reasons.push("runner: checking…");
  else if (S.runner.phase === "A" && !S.runner.runnable.length) reasons.push("No unpaid invoice — issue a new invoice (vLEI §3.3)");
  if (runActive()) reasons.push(`a run is active${S.live.run ? " (" + S.live.run.runId + ")" : ""}`);
  if (S.busy) reasons.push(`another action is running (${S.busy})`);
  const off = reasons.length > 0;
  $("#req").disabled = off; $("#run-text").disabled = off || !$("#req").value.trim();
  const box = $("#run-reason"); box.replaceChildren();
  if (reasons.length) box.append(el("div",{class:"reason"}, ...reasons.map(r => el("div",{text:"Blocked: " + r}))));
  if (S.runner.st === "up" && S.runner.phase === "A") box.append(el("div",{class:"note",text:`Runner is Phase A: a request is matched to a pre-issued unpaid invoice (${S.runner.runnable.map(x => `${x.invoiceNumber} ${x.amount} ${x.currency}`).join(", ") || "none"}); no live issuing or verify steps.`}));
  if (S.runner.st === "up" && S.runner.phase === "B" && isObj(S.runner.next)) box.append(el("div",{class:"note",text:`Next run issues ${S.runner.next.invoiceNumber || "a new invoice"} (runner GET /next-invoice).`}));
  const other = S.runner.active && (!S.live.run || S.runner.active.runId !== S.live.run.runId) && S.runner.active.state !== "finished" ? S.runner.active : null;
  if (other && !runActive()) box.append(el("div",{class:"note"}, `The runner reports another active run (${other.runId}, ${other.state}); a new request will be refused with 409. `,
    el("button",{class:"linkbtn",type:"button",text:"open it here",onclick: () => attachRun(other.runId, {text:`(opened run ${other.runId})`})})));
  if (S.live.err){
    const e = S.live.err;
    box.append(el("div",{class:"result bad",role:"alert"}, `runner refused${e.http ? " (HTTP " + e.http + ")" : ""}: `, el("span",{class:"mono",text:scrub(e.error)}),
      e.activeRunId && (!S.live.run || S.live.run.runId !== e.activeRunId) ? el("span",null, " ", el("button",{class:"linkbtn",type:"button",text:`open run ${e.activeRunId}`,onclick: () => attachRun(e.activeRunId, {text:`(opened run ${e.activeRunId})`})})) : null));
  }
  if (S.live.posting) box.append(el("div",{class:"typing"}, el("span",{class:"spin","aria-hidden":"true"}), " sending your request to the runner…"));
}
function renderChat(){
  renderControls();
  const log = $("#chat-live"), atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 40, top = log.scrollTop;
  const open = new Set([...log.querySelectorAll("details[data-k][open]")].map(n => n.dataset.k));   // keep opened panels open across re-renders
  log.replaceChildren();
  if (!S.chat.length) log.append(el("div",{class:"empty",text:"No run in this page session yet. Type a request below and press Enter."}));
  const lastRun = [...S.chat].reverse().find(x => x.kind === "run");
  for (const item of S.chat){
    if (item.kind === "click"){ log.append(bubble(item.row)); continue; }
    const r = item.run;
    if (item === lastRun) log.append(runLog(r));
    else log.append(el("details",{class:"prevrun","data-k":"run:" + r.runId}, el("summary",{text:`${r.runId} · ${r.started && isObj(r.started.invoice) ? r.started.invoice.invoiceNumber : "no invoice"} · ${r.finished ? r.finished.result : "not finished"}`}), runLog(r)));
  }
  for (const n of log.querySelectorAll("details[data-k]")) if (open.has(n.dataset.k)) n.open = true;
  log.scrollTop = atEnd ? log.scrollHeight : top;
}

function renderAll(){ renderStrip(); renderBanners(); renderBuyer(); renderSeller(); renderChat(); }
function fullPage(title, ...body){ $("#strip").replaceChildren(); $("#main").replaceChildren(el("div",{class:"full",role:"alert"}, el("h2",{text:title}), ...body)); }

/* ---------- boot ---------- */
async function boot(){
  if (location.protocol === "file:"){
    fullPage("Open this page through the local server",
      el("p",null, "This page reads its config, the vLEI evidence and the services over HTTP, which browsers block for files opened from disk."),
      el("p",null, "From the ", el("code",{text:"UI"}), " folder run ", el("code",{text:"node serve.mjs --port 8765"}), " and open ", el("code",{text:"http://127.0.0.1:8765/Agent%20Escalation%20Console.html"}), "."));
    return;
  }
  try { S.cfg = validateConfig(await getJson("./signatory-config.json")); }
  catch (e) { fullPage("signatory-config.json not loaded", el("p",{text:e.message})); return; }
  await loadEvidence();
  try { const acc = await getJson(S.cfg.accountsUrl); if (!isObj(acc) || !isObj(acc.aliases)) throw new Error("aliases{} missing"); S.acc = acc; }
  catch (e) { S.accErr = e.message; }
  $("#req").addEventListener("input", renderControls);
  $("#req").addEventListener("keydown", e => { if (e.key === "Enter" && !$("#run-text").disabled) $("#run-text").click(); });
  $("#run-text").addEventListener("click", () => { const t = $("#req").value.trim(); if (t) startRun(t); });
  renderAll();
  await Promise.all(SERVICES.map(([k,,u]) => probe(k, u)));
  await Promise.all([refreshChain(), fetchRunnerInfo()]);
  renderAll();
  let ticking = false, lastSig = "";
  setInterval(async () => {
    if (ticking || document.hidden) return;
    ticking = true;
    try {
      await Promise.all(SERVICES.map(([k,,u]) => probe(k, u)));
      await Promise.all([refreshChain(), fetchRunnerInfo()]);
      // Full re-render only when something shown changed and no run is streaming (keeps opened "details" open).
      const sig = JSON.stringify([S.probes, S.chain.st, S.chain.why, S.chain.mandate, S.chain.invoices, S.runner]);
      renderStrip();
      if (sig !== lastSig && !runActive() && !S.busy){ lastSig = sig; renderAll(); }
    } finally { ticking = false; }
  }, S.cfg.pollMs * 5);
}
boot();
})();
